<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FireCut</title>
  <script src="./vendor/jquery.min.js"></script>
  <link rel="stylesheet" href="./dist/output.css" />
</head>
<body class="flex flex-col overflow-hidden select-none">

  <!-- Header -->
  <div class="header flex flex-row items-center justify-between py-[7px] px-3 border-b border-[#3a3a3a] flex-shrink-0">
    <div id="btn-undo" class="header-btn flex flex-row items-center py-1 px-[10px] bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white text-xs font-medium cursor-pointer hover:bg-[#363636]">
      <img src="./assets/icons/undo.png" width="13" height="13" alt="" />
      Undo
    </div>

    <span class="text-sm font-semibold">
      <img src="./assets/logos/flame-256.png" width="20" height="20" alt="" />
      FireCut
    </span>

    <div id="btn-reload" class="header-btn flex flex-row items-center py-1 px-[10px] bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white text-xs font-medium cursor-pointer hover:bg-[#363636]">
      Reload plugin
    </div>
  </div>

  <!-- Feature grid -->
  <div class="main flex-1 overflow-y-auto p-[10px] flex flex-col">

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="silences">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/silences.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Remove silences</div>
      </div>
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="fillers">
        <div class="badge absolute top-[6px] right-2 text-[10px] font-medium leading-none text-[#4ade80]">Beta</div>
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/fillers.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Remove fillers</div>
      </div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="repetition">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/repetition.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Remove repetition</div>
      </div>
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="profanity">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/profanity.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Remove profanity</div>
      </div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="zooms">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/zooms.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Add zooms</div>
      </div>
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="chapters">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/chapters.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Add chapters</div>
      </div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="captions">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/captions.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Add captions</div>
      </div>
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="voiceover">
        <div class="badge absolute top-[6px] right-2 text-[10px] font-medium leading-none text-[#a78bfa]">✦ New</div>
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/voiceover.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Add voiceover</div>
      </div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="titles">
        <div class="badge absolute top-[6px] right-2 text-[10px] font-medium leading-none text-[#4ade80]">Beta</div>
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/titles.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Add titles</div>
      </div>
      <div class="feature-card-empty flex-1"></div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="broll">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/bk.broll.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Find B-roll</div>
      </div>
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="music">
        <div class="badge absolute top-[6px] right-2 text-[10px] font-medium leading-none text-[#a78bfa]">✦ New</div>
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/broll-music.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Find music</div>
      </div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="multitrack">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/multitrack.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Multi-track</div>
      </div>
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="highlights">
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/shorts.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Create highlights</div>
      </div>
    </div>

    <div class="grid-row flex flex-row mb-2">
      <div class="feature-card relative flex-1 flex flex-row items-center py-[11px] px-3 mr-2 bg-[#2a2a2a] rounded-lg cursor-pointer hover:bg-[#333333]" data-feature="workflows">
        <div class="badge absolute top-[6px] right-2 text-[10px] font-medium leading-none text-[#4ade80]">Beta</div>
        <div class="card-icon w-[36px] h-[36px] min-w-[36px] rounded-[7px] flex flex-row items-center justify-center mr-[10px]">
          <img src="./assets/icons/workflows.svg" width="20" height="20" alt="" />
        </div>
        <div class="card-label text-[13px] font-medium leading-[1.3] flex-1">Workflows</div>
      </div>
      <div class="feature-card-empty flex-1"></div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer flex flex-row items-center justify-between py-2 px-4 border-t border-[#3a3a3a] flex-shrink-0">
    <div id="btn-feedback" class="footer-btn flex flex-row items-center bg-transparent border-none text-[#9ca3af] text-xs cursor-pointer hover:text-white">
      <img src="./assets/icons/feedback.svg" width="14" height="14" alt="" />
      Feedback
    </div>
    <div id="btn-settings" class="footer-btn flex flex-row items-center bg-transparent border-none text-[#9ca3af] text-xs cursor-pointer hover:text-white">
      <img src="./assets/icons/settings.svg" width="14" height="14" alt="" />
      Settings
    </div>
    <div id="btn-help" class="footer-btn flex flex-row items-center bg-transparent border-none text-[#9ca3af] text-xs cursor-pointer hover:text-white">
      <img src="./assets/icons/help.svg" width="14" height="14" alt="" />
      Help
    </div>
    <div id="btn-notif" class="footer-icon-btn bg-transparent border-none cursor-pointer">
      <img src="./assets/icons/notif-none.svg" width="16" height="16" alt="Notifications" />
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
